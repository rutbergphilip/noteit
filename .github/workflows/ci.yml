name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The live S3 emulator tests (scripts/live_s3_tests.sh) are not run here:
# they need Docker, which GitHub's macOS runners don't provide. They skip themselves.
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Typecheck (every package)
        run: pnpm -C web -r typecheck

      - name: Test
        run: pnpm -C web -r test

      - name: Build
        run: pnpm -C web --filter @noteit/web build

      - name: Release scripts
        # apt mirrors occasionally stall; fail fast instead of holding the job until its timeout.
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          node --test scripts/test/*.test.mjs

      - name: Reproducible client
        run: scripts/check_reproducible_build.sh

  web-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < web/Dockerfile

      - name: Build image
        run: docker build --build-arg NOTEIT_VERSION=0.0.0-ci --build-arg NOTEIT_COMMIT="$GITHUB_SHA" -t noteit-web:ci web

      - name: Smoke test
        run: |
          docker run -d --name noteit -p 127.0.0.1:3000:3000 -e NOTEIT_PUBLIC_URL=http://127.0.0.1:3000 noteit-web:ci
          for _ in $(seq 1 30); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' noteit)" == healthy ]] && break
            sleep 2
          done
          docker inspect --format 'health={{.State.Health.Status}} user={{.Config.User}}' noteit
          [[ "$(docker inspect --format '{{.State.Health.Status}}' noteit)" == healthy ]]
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"needsSetup":true'
          curl -fsS http://127.0.0.1:3000/api/_actions/server-info | grep -q '"version":"0.0.0-ci"'
          docker logs noteit 2>&1 | grep -q "NoteIt setup token"
          # Runs as uid 1000, can write /data and not the app.
          docker exec noteit sh -c 'test "$(id -u)" = 1000 && touch /data/.write-check && ! touch /app/.output/x 2>/dev/null'
          docker rm -f noteit
