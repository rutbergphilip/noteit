name: E2E

# Browser end-to-end tests for the web app (Playwright on Chromium, Firefox and WebKit against the production
# build) and the web ⇄ Mac interop harness (scripts/interop_tests.sh). Kept apart from ci.yml so the two can change
# independently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm -C web/apps/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: pnpm -C web --filter @noteit/web build

      - name: E2E
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: pnpm -C web/apps/web exec playwright test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            web/apps/web/e2e/.report
            web/apps/web/e2e/.results
          retention-days: 7

  interop:
    name: Interop (web ⇄ Mac)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C web install --frozen-lockfile

      - name: Interop
        run: scripts/interop_tests.sh
