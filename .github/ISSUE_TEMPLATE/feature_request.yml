name: Feature request
description: Suggest an idea or improvement for NoteIt.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please check the Roadmap in the README and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / formatting
        - Capture (hotkeys, Quick Capture, menu bar)
        - Organization / search
        - Sync / storage / encryption
        - Self-hosted web app
        - Other
    validations:
      required: false
