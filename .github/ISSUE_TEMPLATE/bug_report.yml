name: Bug report
description: Something in Inkwell doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        > [!WARNING]
        > **Never paste passphrases, access keys, secret keys or other credentials** in this issue — not in the description, logs or screenshots. Redact them before posting. Inkwell maintainers will never ask for them.

        Security vulnerabilities should be reported privately via the repository's **Security** tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.1 (24B83)"
    validations:
      required: true
  - type: input
    id: inkwell-version
    attributes:
      label: Inkwell version or commit
      description: Settings › About shows the version; if you built from source, `git rev-parse --short HEAD` gives the commit.
      placeholder: "e.g. Version 1.0 (202610131200) / 0db2697"
    validations:
      required: true
  - type: dropdown
    id: sync-provider
    attributes:
      label: Sync provider
      options:
        - Not using sync
        - Folder
        - Amazon S3
        - Cloudflare R2
        - Backblaze B2
        - Google Cloud
        - MinIO / NAS
        - Custom S3
    validations:
      required: true
  - type: dropdown
    id: encryption
    attributes:
      label: End-to-end encryption
      options:
        - Not applicable (not using sync)
        - On
        - Off
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or error messages
      description: Redact any passphrases, keys, bucket names or endpoints you don't want public.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Anything else?
    validations:
      required: false
