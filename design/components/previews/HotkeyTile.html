<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="components.css"><meta charset="utf-8"><title>HotkeyTile — preview</title></head>
<body>
<div class="iw-stage col iw-window" style="gap:var(--space-8)">
  <div class="iw-hotkey"><span class="tile" style="background:var(--tile-show-hide)"><svg class="iw-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M2.5 6h11"/></svg></span><span class="txt"><b>Show / Hide NoteIt</b><span>Bring NoteIt forward, or hide it.</span></span><span class="iw-recorder"><span class="iw-key">⌃</span><span class="iw-key">⌥</span><span class="iw-key">I</span></span></div>
  <div class="iw-hotkey"><span class="tile" style="background:var(--tile-quick-capture)"><svg class="iw-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2L4 9h3.5L7 14l5-7H8.5z"/></svg></span><span class="txt"><b>Quick Capture</b><span>Toggle the floating capture panel.</span></span><span class="iw-recorder">Record Shortcut</span></div>
</div>
</body>
</html>
