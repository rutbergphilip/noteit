<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="components.css"><meta charset="utf-8"><title>Logo</title>
<style>
  .wrap { padding:var(--space-16); display:grid; gap:var(--space-16); color:var(--ink); }
  .row { display:grid; grid-template-columns:1.25fr 1fr; gap:var(--space-16); }
  .panel { border:var(--hairline-width) solid var(--hairline); border-radius:var(--radius-panel); padding:var(--space-16); display:grid; gap:var(--space-12); align-content:start; }
  .lbl { font:600 10px/1 var(--font-sans); letter-spacing:.6px; text-transform:uppercase; color:var(--ink-secondary); }
  .icons { display:flex; gap:var(--space-16); align-items:flex-end; }
  .icons figure, .ladder figure { margin:0; display:grid; justify-items:center; gap:6px; }
  figcaption { font:400 11px/14px var(--font-sans); color:var(--ink-secondary); }
  .ladder { display:flex; gap:var(--space-16); align-items:flex-end; }
  .wm { font:italic 800 34px/1 var(--font-sans); letter-spacing:-.5px; }
  .lock { display:flex; align-items:center; gap:10px; color:var(--brand-deep); }
  [data-theme="dark"] .lock.on-ground { color:var(--ink); }
  .stack { display:grid; justify-items:center; gap:6px; color:var(--brand-deep); }
  .wm .it { color:var(--brand-violet); }
  .t-violet .wm .it { color:var(--brand-deep); }
  .t-deep .wm .it { color:var(--brand-pencil); }
  .stack .wm { font-size:26px; }
  [data-theme="dark"] .stack.on-ground { color:var(--ink); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-12); }
  .tile { border-radius:var(--radius-card); min-height:96px; display:grid; place-items:center; padding:var(--space-12); }
  .t-paper { background:var(--brand-paper); }
  .t-violet { background:var(--brand-violet); }
  .t-violet .lock, .t-deep .lock { color:#fff; }
  .t-deep { background:var(--brand-deep); }
  .bars { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-8); }
  .bar { height:26px; border-radius:var(--radius-toolbar); display:flex; align-items:center; justify-content:flex-end; gap:14px; padding:0 12px; font:500 12px/1 var(--font-sans); }
  .bar.l { background:#e9e9ec; color:#000; }
  .bar.d { background:#2a2a2d; color:#fff; }
  .bar span { opacity:.6; margin-right:auto; }
  p { margin:0; font:400 13px/18px var(--font-sans); color:var(--ink-secondary); }
</style></head>
