<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="components.css"><meta charset="utf-8"><title>ToolbarButton — preview</title></head>
<body>
<div class="iw-stage">
  <div class="iw-toolbar" role="toolbar" aria-label="Formatting">
    <button class="iw-tbtn" aria-pressed="true" aria-label="Bold">B</button>
    <button class="iw-tbtn" aria-pressed="false" aria-label="Italic"><i>I</i></button>
    <button class="iw-tbtn" aria-pressed="false" aria-label="Underline" style="text-decoration:underline">U</button>
    <button class="iw-tbtn is-hover" aria-pressed="false" aria-label="Strikethrough" style="text-decoration:line-through">S</button>
    <span class="sep"></span>
    <button class="iw-tbtn" aria-pressed="false" aria-label="Bulleted list"><svg class="iw-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4.5h7.5M6 8h7.5M6 11.5h7.5"/><circle cx="3" cy="4.5" r=".6"/><circle cx="3" cy="8" r=".6"/><circle cx="3" cy="11.5" r=".6"/></svg></button>
    <button class="iw-tbtn" aria-pressed="false" aria-label="Link"><svg class="iw-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 9a2.5 2.5 0 0 0 3.5 0l2-2A2.5 2.5 0 0 0 9 3.5l-.8.8M9 7a2.5 2.5 0 0 0-3.5 0l-2 2A2.5 2.5 0 0 0 7 12.5l.8-.8"/></svg></button>
  </div>
</div>
</body>
</html>
