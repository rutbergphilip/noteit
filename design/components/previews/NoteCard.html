<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="components.css"><meta charset="utf-8"><title>NoteCard — preview</title></head>
<body>
<div class="iw-stage col iw-window" style="gap:2px;padding:var(--space-8);background:var(--surface-editor)">
  <div class="iw-card is-selected">
    <div class="t">Welcome to NoteIt<span class="pin"><svg class="iw-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5h4l-.5 4 2 2v1h-7v-1l2-2z"/><path d="M8 9.5v4"/></svg></span></div>
    <div class="p">Press ⌘N for a new note and ⌘F to search. Type # at the start of a line for a heading.</div>
    <div class="m">1 minute ago</div>
  </div>
  <div class="iw-card" style="--nb:var(--notebook-purple)">
    <div class="t">Custom keyboard shortcuts</div>
    <div class="p">⌃⌘E Equalize the size of all split tabs in Ghostty. ⇧⌘L Switch theme mode.</div>
    <div class="m">Yesterday <span class="dot"></span> Shortcuts</div>
  </div>
</div>
</body>
</html>
